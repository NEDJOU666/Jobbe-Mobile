name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app.json'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: APK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        run: eas build --platform android --profile production --non-interactive

      - name: Get APK download URL from EAS
        id: apk
        run: |
          URL=$(eas build:list --platform android --status finished --limit 1 --non-interactive --json | jq -r '.[0].artifacts.buildUrl')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -L "${{ steps.apk.outputs.url }}" -o jobfinder.apk

      - name: Get app version
        id: version
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: JobFinder v${{ steps.version.outputs.version }}
          body: |
            Android APK build — download via the app website at https://jobfinder.oxbiy.com
          files: jobfinder.apk
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ANDROID_APK_URL in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          APK_DIRECT_URL="https://github.com/NEDJOU666/Jobbe-Mobile/releases/download/v${{ steps.version.outputs.version }}/jobfinder.apk"
          # Update production env var
          curl -s -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"key\": \"ANDROID_APK_URL\",
              \"value\": \"${APK_DIRECT_URL}\",
              \"type\": \"plain\",
              \"target\": [\"production\"]
            }"
          echo "ANDROID_APK_URL set to: $APK_DIRECT_URL"
