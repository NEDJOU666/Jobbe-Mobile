name: Build & Release Android APK

on:
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Auto-trigger when app version in app.json changes on master
  push:
    branches: [master]
    paths:
      - 'app.json'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        run: eas build --platform android --profile production --non-interactive

      - name: Get APK download URL
        id: apk
        run: |
          URL=$(eas build:list --platform android --status finished --limit 1 --non-interactive --json | jq -r '.[0].artifacts.buildUrl')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -L "${{ steps.apk.outputs.url }}" -o jobfinder.apk

      - name: Get app version from app.json
        id: version
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: JobFinder v${{ steps.version.outputs.version }}
          body: |
            ## JobFinder Android APK

            Download and install directly on your Android phone.

            **Installation:**
            1. Download `jobfinder.apk` below
            2. Open the file on your phone
            3. Allow installation from unknown sources if prompted
            4. Tap Install
          files: jobfinder.apk
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
